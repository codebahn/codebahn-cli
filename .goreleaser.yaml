version: 2

builds:
  - main: ./cmd/codebahn
    binary: codebahn
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: archive
    formats: [tar.gz]
    name_template: "codebahn-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
  - id: binary
    formats: [binary]
    name_template: "codebahn-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  ids:
    - binary

signs:
  - artifacts: checksum
    args:
      - --batch
      - --yes
      - --output
      - "${signature}"
      - --detach-sign
      - --armor
      - "${artifact}"
    signature: "${artifact}.asc"

release:
  disable: true
